# One-shot speed QP using the first valid path.
control_period: 0.05
plan_topic: /plan
cmd_vel_topic: /cmd_vel

cruise_speed: 0.60
max_speed: 0.70
max_angular_speed: 1.00
max_acceleration: 1.20
max_deceleration: 1.20
max_lateral_acceleration: 0.60
min_turning_radius: 0.50

# min Σ w_v (v-v_ref)^2 + w_d (v_i-v_{i-1})^2
speed_tracking_weight: 12.0
speed_smoothness_weight: 4.0
