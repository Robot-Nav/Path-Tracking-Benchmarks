# Closed-loop path projection, fixed lookahead, and command limits.
control_period: 0.05
plan_topic: /plan
odom_topic: /odom1
cmd_vel_topic: /cmd_vel
odom_timeout: 0.30

lookahead_distance: 1.50
yaw_filter_alpha: 0.80
goal_tolerance: 0.05

cruise_speed: 0.60
max_speed: 0.70
max_angular_speed: 1.00
max_acceleration: 1.20
max_deceleration: 1.20
max_angular_acceleration: 2.50
max_jerk: 4.00
max_lateral_acceleration: 0.60
min_turning_radius: 0.50
